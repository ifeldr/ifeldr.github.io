# ===============================================================
#  Impostazioni del sito. Dopo una modifica a questo file,
#  in locale serve riavviare "bundle exec jekyll serve".
# ===============================================================

title: "Il tuo nome · Stampa 3D"
description: "Stampa 3D su misura: carica il tuo file STL e scopri subito quanto costa stamparlo."
lang: it

# Indirizzo del sito.
#  - Sito utente (tuonome.github.io):      url: "https://tuonome.github.io"  baseurl: ""
#  - Sito di progetto (tuonome.github.io/repo): url: "https://tuonome.github.io"  baseurl: "/repo"
#  - Dominio personalizzato:              url: "https://www.tuodominio.it"   baseurl: ""
url: "https://ifeldr.github.io"
baseurl: ""

author:
  name: "Lorenzo Garbi"
  ruolo: "Maker e progettista 3D"
  foto: ""          # es. /assets/img/foto.jpg (quadrata, almeno 600 × 600 px). Vuoto = iniziali.

# Link social: lascia vuoto quello che non usi
social:
  instagram: ""     # es. https://www.instagram.com/tuonome
  facebook: ""
  youtube: ""
  printables: ""    # es. https://www.printables.com/@tuonome
  linkedin: ""

# L'email di contatto è quella dei preventivi, in _data/calcolatore_3d.yml

permalink: /blog/:year/:month/:title/
timezone: Europe/Rome
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: blog/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - LEGGIMI.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
