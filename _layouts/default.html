<!doctype html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.classe_body }}">
<a class="salta" href="#contenuto">Vai al contenuto</a>
{% include header.html %}
<main id="contenuto">
{{ content }}
</main>
{% include footer.html %}
<script>
(function () {
  var b = document.querySelector('.menu-apri'), m = document.getElementById('menu');
  if (!b || !m) return;
  b.addEventListener('click', function () {
    var aperto = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!aperto));
    m.classList.toggle('aperto', !aperto);
  });
})();
</script>
</body>
</html>
